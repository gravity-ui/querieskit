name: PR Checks

on:
    pull_request:
        branches: [ main ]

jobs:
    lint-and-type-check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run unit and component tests
              run: npm test

            - name: Check TypeScript types
              run: npx tsc --noEmit

            - name: Build and check widget tree-shaking
              run: npm run test:tree-shaking

            - name: Check published package contracts
              run: npm run test:package-contract

            - name: Bundle isolated package consumers
              run: npm run test:consumer

            - name: Upload consumer bundle statistics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: consumer-bundle-stats
                  path: build/consumer
                  if-no-files-found: ignore

            - name: Check browser test types
              run: npx tsc --noEmit -p tests/browser/tsconfig.json

            - name: Install test browser
              run: npx playwright install --with-deps chromium

            - name: Check Monaco browser integration
              run: npm run test:editors:browser
